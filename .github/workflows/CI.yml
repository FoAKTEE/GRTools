name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    name: ${{ matrix.package }} - Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 1.10 = the [compat] floor; 1.12 = the PINNED reproduction version
        # (reproduce/Manifest.toml + every golden header record Julia 1.12.6).
        julia-version: ["1.10", "1.12"]
        package:
          - .                                # umbrella
          - core/NumericsCore
          - core/BigSpecial
          - core/Data
          - core/TestKit
          - core/Wigner
          - core/Kernels
          - core/EllipticCore
          - capabilities/Spacetime
          - capabilities/Harmonics
          - capabilities/Perturbation
          - capabilities/MetricReconstruction
          - capabilities/SelfForce
          - capabilities/ScalarSelfForce
          - capabilities/PostNewtonian
          - capabilities/ModifiedGravity
          - capabilities/EMRIWaveforms
          - capabilities/Hybrid
          - capabilities/AccretionDisc
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run tests
        env:
          JULIA_NUM_THREADS: 4          # thread-parity gates are skipped (Broken) under 1 thread
        run: |
          julia --project=${{ matrix.package }} -e '
            using Pkg
            Pkg.instantiate()
            Pkg.test()'

  examples:
    name: examples - Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 1.10 = the [compat] floor; 1.12 = the PINNED reproduction version
        # (reproduce/Manifest.toml + every golden header record Julia 1.12.6).
        julia-version: ["1.10", "1.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate umbrella
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run every example (each self-checks; a failed cross-check aborts)
        env:
          JULIA_NUM_THREADS: 4
        run: |
          for f in examples/0*.jl; do
            echo "::group::$f"
            julia --project=. "$f"
            echo "::endgroup::"
          done

  reproduce:
    name: reproduce (fast tier) - Julia 1.12
    runs-on: ubuntu-latest
    # The fast tier is "deterministic and < 5 min at -t4" per driver (reproduce/README.md);
    # 30 rows plus a cold precompile of the umbrella need a generous ceiling.
    timeout-minutes: 300
    # A drifted golden must break the build: this job is never advisory.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          # PINNED, not the "1" float: goldens record the Julia version they were generated
          # under and the reproduce Manifest is resolved against it.
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Instantiate the pinned reproduce environment
        run: julia --project=reproduce -e 'using Pkg; Pkg.instantiate()'
      - name: Re-check every fast-tier golden
        env:
          JULIA_NUM_THREADS: 4
        # run_all.jl runs each driver in its own subprocess at --threads 4 (capped at 8 by
        # the compute-usage policy) and exits non-zero on any mismatch (1) or harness
        # error (2); a documented HOLE (3) counts as skipped, never as a pass.
        run: julia --project=reproduce reproduce/run_all.jl --check --tier fast
