name = "Wigner"
uuid = "6ff5feb8-af12-4c65-941e-1525bdfc7120"
authors = ["GrTools capability migration (Claude)"]
version = "0.1.0"

# Tier-1 core stratum (C2). deps = NumericsCore ONLY (design §5.3) — the angular-momentum
# coupling machinery is HAND-ROLLED (3j/6j via Racah, Racah CG, Wigner-D, 3-harmonic coupling)
# so the WignerSymbols PACKAGE is ELIMINATED from every runtime path (design §7.4 / L4).
# MANDATORY-separate from Harmonics so it never touches the in-degree light-numeric spine.
[deps]
NumericsCore = "54f76139-0f7a-42ab-9084-b9cc78b29132"

[sources]
NumericsCore = {path = "../NumericsCore"}
# test-only (S2 §7.7 hygiene gates): TestKit + its unregistered dep Data, path-mapped for the test env.
TestKit = {path = "../TestKit"}
Data = {path = "../Data"}

[compat]
julia = "1.10"

# Test-characterization oracle: WignerSymbols is a SMALL, light, registered package, added
# TEST-ONLY (never a runtime [deps]) to ground the hand-rolled 3j/6j/CG over a grid of
# (j1,j2,j3,m1,m2,m3). The runtime package carries NO WignerSymbols dependency.
# TestKit (+its Data spine) is a TEST-ONLY GrTools dep powering the §7.7 hygiene gates (test/hygiene.jl).
[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
WignerSymbols = "9f57e263-0b3d-5e2e-b1be-24f2bb48858b"
TestKit = "a6b7dd63-3a78-412f-8db2-e0e7b8b9a65d"
Data = "2e9be357-8831-4976-ad1c-c30f98102c3a"

[targets]
test = ["Test", "WignerSymbols", "TestKit", "Data"]
