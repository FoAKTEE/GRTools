name = "Data"
uuid = "2e9be357-8831-4976-ad1c-c30f98102c3a"
authors = ["GrTools contributors"]
version = "0.1.0"

[deps]
NumericsCore = "54f76139-0f7a-42ab-9084-b9cc78b29132"
DelimitedFiles = "8bb1440f-4735-579b-a4ab-409b98df4dab"
Artifacts = "56f22d72-fd6d-98f1-02f0-08ddc0907c33"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"

# HDF5/JLD2 reader-writer BODIES live in weakdep extensions (design §5.4 extension-activation rule):
# an extension activates ONLY when the LOADING package declares the trigger in its OWN [deps], so the
# numeric path never pays for HDF5/JLD2 — only the tier-5/6 grid/corpus consumers trigger them.
[weakdeps]
HDF5 = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"

[extensions]
DataHDF5Ext = "HDF5"
DataJLD2Ext = "JLD2"

[sources]
NumericsCore = {path = "../NumericsCore"}
# test-only (S2 §7.7 hygiene gates): TestKit, path-mapped for the test env (Data itself is its spine).
TestKit = {path = "../TestKit"}

[compat]
HDF5 = "0.17"
JLD2 = "0.6"
NumericsCore = "0.1"
julia = "1.10"

# Test characterization grounds the HDF5/JLD2 reader-writer bodies via ROUND-TRIP (write a schema
# struct to a temp .h5/.jld2, read it back, assert identity) plus the checksum-verified cached FEW
# grids on disk — so HDF5/JLD2 are LIVE test deps (they fire the weakdep-ext under test) and NO heavy
# legacy package is pulled into the test sandbox.
# TestKit is a TEST-ONLY GrTools dep powering the §7.7 hygiene gates (test/hygiene.jl).
[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
HDF5 = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
TestKit = "a6b7dd63-3a78-412f-8db2-e0e7b8b9a65d"

[targets]
test = ["Test", "HDF5", "JLD2", "Pkg", "TestKit"]
