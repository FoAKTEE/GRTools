# Tier-5 capability (design §4.8, §6.8): the EMRI trajectory + observed-waveform pipeline,
# fusing FastEMRIWaveforms + KerrBackwards. HDF5 HOME #2. v0.1 is an EXPLICIT TRANSITIONAL
# two-fork state — every collision-survivor submodule is bifurcated behind the qualified
# `EMRIWaveforms.KerrBackwards.*` / `EMRIWaveforms.FEW.*` deep namespaces (§4.8 collisions),
# collapsed only after a per-submodule bit-equivalence gate (§13). The 4 dead FEW import edges
# (Teukolsky/TeukolskyPN/TeukolskySpinFluxes/SpinningOrbit) are DELETED → Symbolics-clean.
# Float64/GPU-only: CALLS the BigFloat-generic lower tiers at Float64, imposes no precision
# constraint upward. HDF5 is a DIRECT dep (the trigger that activates Data's HDF5 weakdep-ext).
[deps]
