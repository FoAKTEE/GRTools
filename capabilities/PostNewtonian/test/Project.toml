# Test-only environment for `PostNewtonian` (repro-audit G8). Pkg prefers this over the package's
# [extras]/[targets] when it exists, and — together with the committed `test/Manifest.toml` — it
# PINS the test closure exactly, so the suite resolves offline to the SAME versions on any machine.
#
# The test FILES load `Symbolics`/`SpecialFunctions` by name (symbolic-equality oracles), so both
# are declared here: with a test/Project.toml the environment is exactly this file plus the package
# under test, NOT the package's own [deps].
# JSON is TEST-ONLY (fixture/catalog manifests); it never enters the runtime dep budget.
[deps]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
Symbolics = "0c5d862f-8b57-4792-8d23-62f2024744c7"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"
TestKit = "a6b7dd63-3a78-412f-8db2-e0e7b8b9a65d"
Data = "2e9be357-8831-4976-ad1c-c30f98102c3a"
NumericsCore = "54f76139-0f7a-42ab-9084-b9cc78b29132"

# Paths are relative to THIS file (capabilities/PostNewtonian/test/).
[sources]
TestKit = {path = "../../../core/TestKit"}
Data = {path = "../../../core/Data"}
NumericsCore = {path = "../../../core/NumericsCore"}

[compat]
Data = "0.1"
JSON = "0.21, 1"
SpecialFunctions = "2"
Symbolics = "7"
NumericsCore = "0.1"
TestKit = "0.1"
julia = "1.10"
