name = "ModifiedGravity"
uuid = "3a8f1d62-9c47-4e5b-8a10-2f6b7c4d9e03"
authors = ["GrTools capability migration (Claude)"]
version = "0.1.0"

# Tier-4 beyond-GR (modified Teukolsky) source machinery (design §4.7) — the THIN research surface
# absorbing legacy ModifiedTeukolsky (Polcar & Witzany 2025, arXiv:2507.15720): a thin equatorial
# matter-ring back-reaction whose reconstructed (0,1) metric feeds an EFFECTIVE SOURCE for the
# perturbed Weyl scalar ψ4. Self-contained — no metric-reconstruction package dependency (the CCK
# psi4←Hertz identity is hard-baked as a closed-form kernel); reuses Perturbation's Teukolsky
# radial engine for its OWN Hertz front-end. Every numeric primitive is type-generic {T} so the
# BigFloat precision (256..2048-bit) inherited from Perturbation/Harmonics is preserved. HDF5-free
# + Symbolics-free; the only data surface is the 12-col .dat ring-forcing source tables.
[deps]
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
NumericsCore = "54f76139-0f7a-42ab-9084-b9cc78b29132"
Harmonics = "abf3daaf-bc8b-489b-a3fd-54920b7d8f29"
Perturbation = "12c091d5-3f53-42c4-bffe-b2905e161585"
Data = "2e9be357-8831-4976-ad1c-c30f98102c3a"

[sources]
NumericsCore = {path = "../../core/NumericsCore"}
Harmonics = {path = "../Harmonics"}
Perturbation = {path = "../Perturbation"}
Data = {path = "../../core/Data"}
# test-only (S2 §7.7 hygiene gates): TestKit, path-mapped for the test env (Data already above).
TestKit = {path = "../../core/TestKit"}

[compat]
julia = "1.10"

# Test characterization is by FROZEN oracle literals — the upstream wolframscript/paclet values
# (source kernels, RadHzpotmode, Sourcesamplitudes) and the 3 shipped .dat source tables baked
# verbatim — plus closed-form round-trip / minus-mode self-symmetry identities, evaluated through
# the GrTools deps (Data / Harmonics / Perturbation) already in [deps]. NO live legacy dep: the
# heavy ModifiedTeukolsky closure would blow the cold-compile budget (test-dep weight rule), and
# every expected value here is frozen so it is not needed.
# TestKit is a TEST-ONLY GrTools dep powering the §7.7 hygiene gates (test/hygiene.jl).
[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestKit = "a6b7dd63-3a78-412f-8db2-e0e7b8b9a65d"

[targets]
test = ["Test", "TestKit"]
