name = "Harmonics"
uuid = "abf3daaf-bc8b-489b-a3fd-54920b7d8f29"
authors = ["GrTools contributors"]
version = "0.1.0"

# Tier-2 spine root (design §4.2): the angular-eigenfunction FOUNDATION — SWSH eigenvalues +
# S_lm(θ) + spin-weighted spherical Y + the unified m<0 parity surface, with BigFloat
# eigenvalue inheritance. Heavy-dep-FREE by construction: the closure is EXACTLY the §3.2
# binding-DAG pin {LinearAlgebra, NumericsCore} (spine-root invariant). Carries NO local
# Kummer/continued-fraction copy — consumes the promoted light-tier primitive from NumericsCore.
[deps]
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
NumericsCore = "54f76139-0f7a-42ab-9084-b9cc78b29132"

[sources]
NumericsCore = {path = "../../core/NumericsCore"}
# test-only (S2 §7.7 hygiene gates): TestKit + its unregistered dep Data, path-mapped for the test env.
TestKit = {path = "../../core/TestKit"}
Data = {path = "../../core/Data"}

[compat]
julia = "1.10"

# Phase7-B: the SpinWeightedSpheroidalHarmonics test-characterization oracle was BAKED into
# test/fixtures/*_ref.jl (captured once from the legacy port on the exact test arg grids), so
# the test suite no longer needs packages/* to run. The runtime package carries NO SWSH dep.
# TestKit (+its Data spine) is a TEST-ONLY GrTools dep powering the §7.7 hygiene gates (test/hygiene.jl).
[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestKit = "a6b7dd63-3a78-412f-8db2-e0e7b8b9a65d"
Data = "2e9be357-8831-4976-ad1c-c30f98102c3a"

[targets]
test = ["Test", "TestKit", "Data"]
