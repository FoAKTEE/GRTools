name = "AccretionDisc"
uuid = "41b4f346-9cfd-4132-92af-b9cd45d2bbed"
authors = ["GrTool capability migration (Claude)"]
version = "0.1.0"

# Tier-6 EMRI-accretion-disc capability (design §4.10), the TOP of the capability DAG (nothing
# depends on it). The Lindblad-torque / spiral-density-wave disc front-end that fuses the legacy
# DiscModes (relativistic disc-mode solver) and DiscEMRIForce (circular-equatorial Kerr thin-disc
# torque) into two namespaced submodules:
#   - Modes : the relativistic disc-mode solver — κ_r² radial epicyclic frequency from the
#             Spacetime geodesic SHEAR (physics, independent of the perturbation 𝒲), the
#             height-averaged κ²-dispersion reduced operator (Lin-Shu / Goldreich-Tremaine
#             density-wave reduction D = κ² − ω̃²), the B_m mode functions and the 𝔉_m forcing
#             source, Lindblad/corotation resonance torque. From DiscModes.
#   - Force : the circular-equatorial Kerr thin-disc torque front-end — CONSUMES
#             MetricReconstruction.Lorenz.closure_kerr / reconstruct_kerr (NOT SelfForce, NOT
#             Kernels) + the a=0 Lorenz corpus; the spinning-BH fluid solve / torque balance.
#             HDF5 is needed ONLY by this submodule (captured disc-mode data). From DiscEMRIForce.
# Every primitive is type-generic {T} so BigFloat precision (256..2048-bit) is inherited.
[deps]
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
NumericsCore = "54f76139-0f7a-42ab-9084-b9cc78b29132"
Data = "2e9be357-8831-4976-ad1c-c30f98102c3a"
Spacetime = "6cd685be-be12-48c2-bc38-9d046c4f5e88"
Harmonics = "abf3daaf-bc8b-489b-a3fd-54920b7d8f29"
Perturbation = "12c091d5-3f53-42c4-bffe-b2905e161585"
MetricReconstruction = "c7b6efb7-e918-408f-a652-a8355248f733"
HDF5 = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"

[sources]
TestKit = {path = "../../core/TestKit"}
NumericsCore = {path = "../../core/NumericsCore"}
Data = {path = "../../core/Data"}
Spacetime = {path = "../Spacetime"}
Harmonics = {path = "../Harmonics"}
Perturbation = {path = "../Perturbation"}
MetricReconstruction = {path = "../MetricReconstruction"}
# DiscModes is the legacy disc-mode oracle. Per the TEST-DEP WEIGHT RULE it is MODERATE/HEAVY
# (pulls Teukolsky/KerrGeodesics/SWSH/FastGaussQuadrature) so it is NOT a live [targets].test dep:
# κ_r² is grounded by the geodesic closed form, the disc-mode leaves by captured arXiv:2601.19123 /
# DiscModes one-shot fixtures (capture scripts cited in the test files). The path is recorded here
# for the capture scripts only; the test cold-compile resolves the LIGHT GrTool deps only.
# DiscModes (packages/DiscModes) is the MODERATE/HEAVY disc-mode oracle — NOT a live test-dep
# (a [sources] entry without a matching test-target dep orphans in the Pkg test sandbox). Its
# closed-form profiles (csound/eden0/Delta_r/_risco) were captured ONCE as Float64 fixtures baked
# into the test files; re-capture by running RelativisticDisc.{csound,eden0,Delta_r,_risco} from
# `julia --project=packages/DiscModes`.
# KerrGeodesics.KerrGeoFrequencies(a,r,0,1) (Omegaph/Omegar) grounds disc_OmegaK & kappar2; the
# oracle values were captured ONCE as Float64 fixtures (kg_freq in test/Modes/test_background.jl),
# so the package no longer needs packages/* to test.

[compat]
julia = "1.10"

[extras]
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestKit = "a6b7dd63-3a78-412f-8db2-e0e7b8b9a65d"

[targets]
test = ["Test", "TestKit"]
