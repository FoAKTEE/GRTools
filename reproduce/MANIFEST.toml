notes = "ESSF::fig-error-budget. Fig. 7 (fig:error_budget, main.tex:706-710 + :722-725): the F_r error budget over spin at r0 = ISCO and r0 = 10 M -- a |F_r| strip above a relative-error panel per column, with the three curves of main.tex:722 (solid |F_r - F_r^ref|/|F_r| against Warburton-Barack, dashed truncation at m <= 20, dotted numerical resolution) and the layered grey budget fills. THE PUBLISHED FIGURE WAS READ OFF ITS OWN VECTOR PATHS (matplotlib PDF; calibrated on the axis tick STROKES, checked independently by the published |F_r| strip reproducing the printed WB table to 0.10 % at all seven of its points). Three structural facts follow, none guessable from the raster: (i) NINE spins are sampled, not the five tick labels -- -0.998, -0.9, -0.7, -0.5, 0, +0.5, +0.7, +0.9, +0.998; (ii) the solid curve and the |F_r| strip carry only SEVEN points, |a| <= 0.9, while the dashed and dotted carry nine -- the marker count settles it exactly (2x7 + 2x7 + 2x9 + 2x9 + 3 legend = 67 filled circles, and the PDF has 67) -- and the REASON is WARBURTON-BARACK'S SPIN COVERAGE, whose tables stop at |a| <= 0.9 AT EVERY RADIUS. That is not the same as 'no printed cell': the published ISCO column has SEVEN reference points while the printed tables carry exactly ONE cell at an ISCO radius (a = 0, r0 = 6 M), because the printed r0 grid meets an ISCO radius only there. So our blank at |a| = 0.998 is the paper's own; our six blanks on the ISCO column are ours; (iii) [PRELIMINARY, AN INFERRED HYPOTHESIS] the published F_r carries no fitted tail. The published reference/truncation ratio is 2.81-4.63, which is the m_max/(p-1) ~ 3.6 factor row 46 measured between the true remainder and the omit-the-largest-m estimator, and a fitted tail would have removed the remainder. THE PAPER DOES NOT SAY THIS: what it says is consistent with it in two places, main.tex:722 naming exactly one acceleration ('the F_{r,[4]} regularization parameter from [Heffernan 2014] to accelerate the sum over m-modes