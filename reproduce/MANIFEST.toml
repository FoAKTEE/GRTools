status = "solid"
notes = "Harness self-test: Bardeen ISCO (Float64 + 256-bit BigFloat), Kerr frequencies, every golden value type (scalar/Bool/String/BigFloat/Complex/Vector/Matrix/non-finite) and a JSON round trip; rtol 1e-12."

